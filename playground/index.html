<body class="playground">
  <a href="/" class="back-button-float" aria-label="Back to home"></a>

  <main>
    <!-- Text column: same 720px width as a journal entry -->
    <header class="playground-container">
      <h1 class="text-large"><span class="hero-mark">Playground<svg class="hero-dot"
            viewBox="0 0 10 10" aria-hidden="true">
            <circle cx="5" cy="5" r="5" />
          </svg></span></h1>
      <div class="playground-meta" id="shots-meta" aria-live="polite"></div>
      <div class="divider"></div>

      <p class="playground-intro playground-intro--lead">A collection of quick visual experiments, UI concepts, logo designs, typography, random stuffs, and unrefined ideas. Some evolve into full-scale projects; others exist purely for the sake of exploring process, direction, and creative freedom.</p>
      <p class="playground-intro">2026 — all rights reserved.</p>
    </header>

    <!-- Staggered grid: full screen width, not limited by the text column -->
    <div id="shots" class="shots"></div>
  </main>

  <script src="/image-zoom.js" defer></script>
  <script src="/playground-script.js" defer></script>
