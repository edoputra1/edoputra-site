<body>
  <aside class="sidebar-fixed" role="complementary">
    <div class="sidebar-clock" id="clock">— H00 M00 S00.0</div>
    <div class="sidebar-name" id="typewriter"></div>
  </aside>

  <main class="content-wrapper">
    <div class="section-break">
      <div id="globe-container" class="globe-container"></div>

      <div class="mobile-spacer spacer-large" aria-hidden="true"></div>
    </div>

    <div class="section-break force-column">
      <div class="mobile-spacer spacer-large" aria-hidden="true"></div>
      <h1 class="text-large">
        404<br>— Page Not <span class="hero-mark">Found<svg class="hero-dot"
            viewBox="0 0 240 240" aria-hidden="true">
            <path d="M68.3821 216.874L216.875 68.3811L171.62 23.1263L23.1273 171.619L68.3821 216.874Z" fill="#0026FF"/>
            <path d="M23.127 68.3811L171.619 216.873L216.874 171.619L68.3818 23.1262L23.127 68.3811Z" fill="#0026FF"/>
          </svg></span>
      </h1>

      <div class="text-small">This location does not exist within authorized Super Earth star charts. Safety Protocol Alpha activated. FTL jump sequence initializing. Returning you to Super Earth for re-education.</div>

      <div class="cta-wrap">
        <a class="cta-button cta-animated" href="https://edoputra.com">
          <span class="cta-text">Back to Home</span>
        </a>
      </div>

      <div class="divider"></div>
    </div>
  </main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('globe-container');
  if (!container) return;

  const width = Math.min(window.innerWidth * 0.9, 500);
  const height = width;

  const svg = d3.select('#globe-container')
    .append('svg')
    .attr('width', width)
    .attr('height', height)
    .attr('viewBox', `0 0 ${width} ${height}`);

  const projection = d3.geoOrthographic()
    .scale(width * 0.4)
    .center([0, 0])
    .rotate([0, -20, 0])
    .translate([width / 2, height / 2]);

  const path = d3.geoPath().projection(projection);
  const graticule = d3.geoGraticule();

  const g = svg.append('g');

  g.append('path')
    .datum({type: 'Sphere'})
    .attr('class', 'sphere')
    .attr('d', path)
    .attr('fill', 'rgba(0, 0, 0, 0.5)')
    .attr('stroke', 'rgba(255, 255, 255, 0.2)')
    .attr('stroke-width', '1px');

  g.append('path')
    .datum(graticule())
    .attr('class', 'graticule')
    .attr('d', path)
    .attr('fill', 'none')
    .attr('stroke', 'rgba(0, 38, 255, 0.4)')
    .attr('stroke-width', '0.75px');

  const countries = g.append('g').attr('class', 'countries');

  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(data => {
    const worldData = topojson.feature(data, data.objects.countries);

    countries.selectAll('path')
      .data(worldData.features)
      .enter()
      .append('path')
      .attr('d', path)
      .attr('fill', 'rgba(255, 255, 255, 0.1)')
      .attr('stroke', 'rgba(255, 255, 255, 0.3)')
      .attr('stroke-width', '0.5px');
  });

  d3.timer(() => {
    const rotate = projection.rotate();
    projection.rotate([rotate[0] + 0.2, rotate[1]]);

    svg.selectAll('path').attr('d', path);
  });
});
</script>
</body>

</html>
